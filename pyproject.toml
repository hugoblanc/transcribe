[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcribe"
version = "0.1.0"
description = "CLI tool for meeting transcription with speaker diarization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Hugo Blanc"}
]
dependencies = [
    "sounddevice>=0.4.6",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "openai-whisper>=20231117",
    "click>=8.1.0",
    "tqdm>=4.65.0",
]

[project.scripts]
transcribe = "transcribe.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["transcribe*"]
